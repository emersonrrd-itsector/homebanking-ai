name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Restore dependencies
        run: dotnet restore src/api/HomeBanking.Api/HomeBanking.Api.csproj
      
      - name: Build API
        run: dotnet build src/api/HomeBanking.Api/HomeBanking.Api.csproj --no-restore
      
      - name: Run API tests
        run: dotnet test src/api/HomeBanking.Api.Tests/HomeBanking.Api.Tests.csproj --no-build --verbosity normal

  frontend-tests:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json
      
      - name: Install dependencies
        working-directory: src/web
        run: npm ci
      
      - name: Build frontend
        working-directory: src/web
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/web/dist

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [api-tests, frontend-tests]
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install frontend dependencies
        working-directory: src/web
        run: npm ci
      
      - name: Install E2E test dependencies
        working-directory: tests/e2e
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      
      - name: Run E2E tests
        working-directory: tests/e2e
        run: npm test
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 30
